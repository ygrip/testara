# NOTE: classes.default is same_thread (not concurrent). TestFramework now holds a single
# run-level TestContext (see TestFramework javadoc) instead of a per-thread ThreadLocal, matching
# real Cucumber usage where exactly one framework "run" exists per JVM. Running test CLASSES
# concurrently would mean multiple classes' BeforeAll/AfterEach (each simulating its own
# "run" via TestContextExtension/TestFramework.initialize()/clear()) stomp on that single shared
# context from different threads at the same time, which is not a scenario the production
# framework needs to support. Methods within a single class may still run concurrently, matching
# the single-run-many-scenarios Cucumber model this framework targets.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
