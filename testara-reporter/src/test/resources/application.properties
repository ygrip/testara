#Consul properties
config.consul.enabled=${CONSUL_ENABLED:true}
config.consul.host=${CONSUL_HOST:localhost}
config.consul.port=${CONSUL_PORT:8500}
config.consul.acl-token=${CONSUL_TOKEN:local-root-token}
config.consul.prefix=${CONFIG_PATH:config/testara-automation}/${TEST_ENV:qa}/
#Vault properties
config.vault.enabled=${VAULT_ENABLED:true}
config.vault.address=${VAULT_HOST:http://127.0.0.1:8200}
config.vault.token=${VAULT_TOKEN:myroot}
config.vault.engine-version=${VAULT_ENGINE_VERSION:2}
config.vault.path=${VAULT_PATH:config/testara-automation}/${TEST_ENV:qa}
#Kafka Properties
kafka.service.quest.servers=${KAFKA_SERVERS:kafka-01.qa2-sg.cld:9092,kafka-02.qa2-sg.cld:9092}
kafka.service.quest.groupId=MEMBER_QUEST_AUTOMATION
kafka.service.quest.topics.user_action=io.github.ygrip.quest.user.action.event
kafka.service.message.servers=kafka-01.preprod-sg.cld:9092,kafka-02.preprod-sg.cld:9092
kafka.service.message.groupId=X-MESSAGE-AUTOMATION
kafka.service.message.topics.insert_inbox=io.github.ygrip.aggregate.notification.inbox.save
# Use earliest offset for testing to read existing messages
kafka.autoOffsetReset=earliest
# Use shorter timeout for tests (10 seconds instead of 60)
kafka.requestTimeoutMs=10000
