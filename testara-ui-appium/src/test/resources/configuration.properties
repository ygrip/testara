#Scanner configuration
class.loader.reject-packages=org.*,com.sun.*,java.*,javax.*,io.netty.*,org.springframework.*,net.bytebuddy.*,com.fasterxml.*,org.apache.*,org.junit.*,org.hamcrest.*,org.mockito.*,com.google.*,org.slf4j.*,ch.qos.logback.*,org.seleniumhq.*,net.serenitybdd.*,io.restassured.*,com.browserup.*,org.json.*,org.yaml.*,com.jayway.*,org.objenesis.*,net.sf.*,org.w3c.*,org.xml.*,com.squareup.*,okhttp3.*,retrofit2.*,com.github.*,io.github.classgraph.*,io.github.bonigarcia.*,org.jetbrains.*,kotlin.*,kotlinx.*
class.loader.enable-parallel-scanning=false
class.loader.buffer-size=33554432
class.loader.default-scan-locations=io.github.ygrip.testara
class.loader.scan-locations.request-data=io.github.ygrip.testara
class.loader.scan-locations.response-data=io.github.ygrip.testara
#Validator Helper configuration
validator.helper.scan-locations=io.github.ygrip.testara.validation
validator.helper.scan-timeout=5
#--------------------------------------------
#Browser setting
#--------------------------------------------
appium.driver.owner=Automation Framework
appium.driver.enable-fallback=true
appium.driver.enable-web-socket=true
appium.driver.maximize-browser=true
appium.driver.headless=false
#--------------------------------------------
#Remote driver for appium setting
#--------------------------------------------
appium.driver.remote-driver.android.enabled=true
appium.driver.remote-driver.android.uri=http://0.0.0.0:4723/wd/hub/
appium.driver.remote-driver.android.startServer=true
appium.driver.remote-driver.ios.enabled=true
appium.driver.remote-driver.ios.uri=http://0.0.0.0:4723/wd/hub/
appium.driver.remote-driver.ios.startServer=true
#--------------------------------------------
#Proxy Setting
#--------------------------------------------
appium.driver.standalone-proxy-url=http://localhost:9091/
#--------------------------------------------
#Driver Capabilities Setting
#--------------------------------------------
#--------------------------------------------
#Android
#--------------------------------------------
appium.driver.capabilities.android.android.deviceName=Android Emulator
appium.driver.capabilities.android.android.platformName=Android
appium.driver.capabilities.android.android.newCommandTimeout=30000
appium.driver.capabilities.android.android.noReset=true
appium.driver.capabilities.android.android.avd=Pixel3aAPI28
appium.driver.capabilities.android.android.fullReset=false
appium.driver.capabilities.android.android.automationName=UiAutomator2
appium.driver.capabilities.android.android.uiautomator2ServerInstallTimeout=900000
appium.driver.capabilities.android.android.androidInstallTimeout=900000
appium.driver.capabilities.android.android.adbExecTimeout=90000
#--------------------------------------------
#iOS
#--------------------------------------------
appium.driver.capabilities.ios.ios.deviceName=iOS Emulator
appium.driver.capabilities.ios.ios.platformName=ios
appium.driver.capabilities.ios.ios.noReset=true
appium.driver.capabilities.ios.ios.platformVersion=8.0
appium.driver.capabilities.ios.ios.avd=Nexus5XAPI26
appium.driver.capabilities.ios.ios.automationName=XCUITest