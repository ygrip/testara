#Scanner configuration
class.loader.reject-packages=org.*,com.sun.*,java.*,javax.*,io.netty.*,org.springframework.*,net.bytebuddy.*,com.fasterxml.*,org.apache.*,org.junit.*,org.hamcrest.*,org.mockito.*,com.google.*,org.slf4j.*,ch.qos.logback.*,org.seleniumhq.*,net.serenitybdd.*,io.restassured.*,com.browserup.*,org.json.*,org.yaml.*,com.jayway.*,org.objenesis.*,net.sf.*,org.w3c.*,org.xml.*,com.squareup.*,okhttp3.*,retrofit2.*,com.github.*,io.github.classgraph.*,io.github.bonigarcia.*,org.jetbrains.*,kotlin.*,kotlinx.*
class.loader.enable-parallel-scanning=false
class.loader.buffer-size=33554432
class.loader.default-scan-locations=io.github.ygrip.testara
class.loader.scan-locations.request-data=io.github.ygrip.testara
class.loader.scan-locations.response-data=io.github.ygrip.testara
#Validator Helper configuration
validator.helper.scan-locations=io.github.ygrip.testara.validation
validator.helper.scan-timeout=5
#--------------------------------------------
#Browser setting
#--------------------------------------------
selenium.driver.owner=Automation Framework
selenium.driver.enable-fallback=true
selenium.driver.enable-web-socket=true
selenium.driver.maximize-browser=true
selenium.driver.headless=false
#--------------------------------------------
#Browser Version Setting
#--------------------------------------------
selenium.driver.version.chrome=
selenium.driver.version.firefox=
selenium.driver.version.edge=
#--------------------------------------------
#Remote web driver setting
#--------------------------------------------
selenium.driver.remote-driver.default.enabled=false
selenium.driver.remote-driver.default.uri=http://localhost:4444/
selenium.driver.remote-driver.default.enable-vnc=true
selenium.driver.remote-driver.default.enable-video=false
#--------------------------------------------
#Remote driver for appium setting
#--------------------------------------------
selenium.driver.remote-driver.android.enabled=true
selenium.driver.remote-driver.android.uri=http://0.0.0.0:4723/wd/hub/
selenium.driver.remote-driver.android.startServer=true
selenium.driver.remote-driver.ios.enabled=true
selenium.driver.remote-driver.ios.uri=http://0.0.0.0:4723/wd/hub/
selenium.driver.remote-driver.ios.startServer=true
#--------------------------------------------
#Proxy Setting
#--------------------------------------------
selenium.driver.standalone-proxy-url=http://localhost:9091/
#--------------------------------------------
#User Agent Setting
#--------------------------------------------
selenium.driver.user-agent.desktop.chrome=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Safari/537.36
selenium.driver.user-agent.desktop.firefox=Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:92.0) Gecko/20100101 Firefox/92.0
selenium.driver.user-agent.mobile.firefox=Mozilla/5.0 (Linux; Android 8.0.0; Pixel 2 XL Build/OPD1.170816.004) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396.87 Mobile Safari/537.36
selenium.driver.user-agent.mobile.chrome=Mozilla/5.0 (Linux; Android 8.0; Pixel 2 Build/OPD3.170816.012) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.82 Mobile Safari/537.36
selenium.driver.user-agent.mobile.edge=Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.159 Mobile Safari/537.36 Edg/92.0.902.78
#--------------------------------------------
#Emulation Setting
#--------------------------------------------
selenium.driver.emulation.mobile.firefox.dimension.width=360
selenium.driver.emulation.mobile.firefox.dimension.height=720
selenium.driver.emulation.mobile.firefox.dimension.pixelRatio=3.0
selenium.driver.emulation.mobile.firefox.adjust-dimension=true
selenium.driver.emulation.mobile.firefox.device-name=
selenium.driver.emulation.mobile.chrome.dimension.width=360
selenium.driver.emulation.mobile.chrome.dimension.height=720
selenium.driver.emulation.mobile.chrome.dimension.pixelRatio=3.0
selenium.driver.emulation.mobile.chrome.adjust-dimension=false
selenium.driver.emulation.mobile.chrome.device-name=Nexus 5
selenium.driver.emulation.mobile.opera.dimension.width=360
selenium.driver.emulation.mobile.opera.dimension.height=720
selenium.driver.emulation.mobile.opera.dimension.pixelRatio=3.0
selenium.driver.emulation.mobile.opera.adjust-dimension=true
selenium.driver.emulation.mobile.opera.device-name=Nexus 5
selenium.driver.emulation.mobile.edge.dimension.width=360
selenium.driver.emulation.mobile.edge.dimension.height=720
selenium.driver.emulation.mobile.edge.dimension.pixelRatio=3.0
selenium.driver.emulation.mobile.edge.adjust-dimension=false
selenium.driver.emulation.mobile.edge.device-name=
#--------------------------------------------
#Driver Capabilities Setting
#--------------------------------------------
#Mobile Chrome
selenium.driver.args.mobile.chrome.[0]=--remote-allow-origins=*
selenium.driver.capabilities.mobile.chrome.real_mobile=true
#Desktop Chrome
selenium.driver.args.desktop.chrome.[0]=--remote-allow-origins=*
#Desktop Edge
selenium.driver.capabilities.desktop.edge.os=Windows
selenium.driver.capabilities.desktop.edge.os_version=10
selenium.driver.capabilities.desktop.edge.rotatable=true
selenium.driver.capabilities.desktop.edge.platform=ANY
#Android
selenium.driver.capabilities.android.android.deviceName=Android Emulator
selenium.driver.capabilities.android.android.platformName=Android
selenium.driver.capabilities.android.android.newCommandTimeout=30000
selenium.driver.capabilities.android.android.noReset=true
selenium.driver.capabilities.android.android.avd=Pixel3aAPI28
selenium.driver.capabilities.android.android.fullReset=false
selenium.driver.capabilities.android.android.automationName=UiAutomator2
selenium.driver.capabilities.android.android.uiautomator2ServerInstallTimeout=900000
selenium.driver.capabilities.android.android.androidInstallTimeout=900000
selenium.driver.capabilities.android.android.adbExecTimeout=90000
#iOS
selenium.driver.capabilities.ios.ios.deviceName=iOS Emulator
selenium.driver.capabilities.ios.ios.platformName=ios
selenium.driver.capabilities.ios.ios.noReset=true
selenium.driver.capabilities.ios.ios.platformVersion=8.0
selenium.driver.capabilities.ios.ios.avd=Nexus5XAPI26
selenium.driver.capabilities.ios.ios.automationName=XCUITest