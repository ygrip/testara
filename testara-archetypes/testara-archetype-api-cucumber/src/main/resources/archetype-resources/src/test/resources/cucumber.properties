cucumber.publish.enabled=false
cucumber.publish.quiet=true
cucumber.object-factory=io.github.ygrip.testara.cucumber.factory.TestaraObjectFactory
cucumber.glue=io.github.ygrip.testara,${package}
# JSON report is what testara-agent test-run and the reporter plugin read
cucumber.plugin=html:target/destination/cucumber.html,json:target/destination/cucumber.json,rerun:target/rerun/rerun.txt
cucumber.snippet-type=camelcase
cucumber.features=classpath:features
