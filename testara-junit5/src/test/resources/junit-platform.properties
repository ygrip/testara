# These tests drive TestaraFrameworkExtension's static lifecycle state directly (the same static
# state a real engine run would use), so test classes run sequentially by default to avoid one
# test class's beforeAll/resetFramework() stomping another's mid-run. Individual test methods
# that are safe to run concurrently opt in via @Execution(ExecutionMode.CONCURRENT).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
