#Configuration
# Custom output directory for load test logs
api.load-test-log-output-dir=target/load-test-logs
# Load test file logging (writes to target/load-test-logs/)
api.load-test-enable-file-logging=true
# Load test console logging (verbose, prints each request/response)
api.load-test-enable-console-logging=false
# Log request details
api.load-test-log-requests=true
# Log response details
api.load-test-log-responses=true
# File logging for regular API requests (via RequestBuilderImpl interceptors)
api.enable-file-logging=true
api.enable-request-log=true
api.enable-response-log=true
api.request-logging=ALL
api.response-logging=STATUS,BODY
automation.config.time-zone=Asia/Jakarta
automation.config.template-folder=/src/test/resources/files/
automation.config.script-folder=/src/test/resources/files/
automation.config.schema-folder=/src/test/resources/files/
#Scanner configuration
class.loader.reject-packages=org.*,com.sun.*,java.*,javax.*,io.netty.*,org.springframework.*,net.bytebuddy.*,com.fasterxml.*,org.apache.*,org.junit.*,org.hamcrest.*,org.mockito.*,com.google.*,org.slf4j.*,ch.qos.logback.*,org.seleniumhq.*,net.serenitybdd.*,io.restassured.*,com.browserup.*,org.json.*,org.yaml.*,com.jayway.*,org.objenesis.*,net.sf.*,org.w3c.*,org.xml.*,com.squareup.*,okhttp3.*,retrofit2.*,com.github.*,io.github.classgraph.*,io.github.bonigarcia.*,org.jetbrains.*,kotlin.*,kotlinx.*
class.loader.enable-parallel-scanning=false
class.loader.buffer-size=33554432
class.loader.default-scan-locations=io.github.ygrip.testara
class.loader.scan-locations.request-data=io.github.ygrip.testara
class.loader.scan-locations.response-data=io.github.ygrip.testara