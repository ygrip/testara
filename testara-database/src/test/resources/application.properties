#Consul properties
config.consul.enabled=${CONSUL_ENABLED:false}
config.consul.host=${CONSUL_HOST:localhost}
config.consul.port=${CONSUL_PORT:8500}
config.consul.acl-token=${CONSUL_TOKEN:local-root-token}
config.consul.prefix=${CONFIG_PATH:config/testara-automation}/${TEST_ENV:qa}/
#Vault properties
config.vault.enabled=${VAULT_ENABLED:false}
config.vault.address=${VAULT_HOST:http://127.0.0.1:8200}
config.vault.token=${VAULT_TOKEN:myroot}
config.vault.engine-version=${VAULT_ENGINE_VERSION:2}
config.vault.path=${VAULT_PATH:config/testara-automation}/${TEST_ENV:qa}
#SQL Database properties
sql.service.xmessage.uri=${XMESSAGE_DB_URI:jdbc:postgresql://localhost:5432/x_message_template}
sql.service.xmessage.username=${XMESSAGE_DB_USERNAME:testuser}
sql.service.xmessage.password=${XMESSAGE_DB_PASSWORD:testpass}
#No-SQL Database properties
mongo.service.agp.connection-string=${AGP_MONGO_DB_URI:mongodb://localhost:27017}
mongo.service.agp.db-name=${AGP_MONGO_DB_NAME:aggreagate_platform}
mongo.service.agp-query.connection-string=${AGP_MONGO_DB_URI:mongodb://localhost:27017}
mongo.service.agp-query.db-name=${AGP_MONGO_DB_NAME:aggreagate_platform}
