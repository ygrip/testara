#Scanner configuration
class.loader.reject-packages=org.*,com.sun.*,java.*,javax.*,io.netty.*,org.springframework.*,net.bytebuddy.*,com.fasterxml.*,org.apache.*,org.junit.*,org.hamcrest.*,org.mockito.*,com.google.*,org.slf4j.*,ch.qos.logback.*,org.seleniumhq.*,net.serenitybdd.*,io.restassured.*,com.browserup.*,org.json.*,org.yaml.*,com.jayway.*,org.objenesis.*,net.sf.*,org.w3c.*,org.xml.*,com.squareup.*,okhttp3.*,retrofit2.*,com.github.*,io.github.classgraph.*,io.github.bonigarcia.*,org.jetbrains.*,kotlin.*,kotlinx.*,com.microsoft.playwright.*,com.vibium.*
class.loader.enable-parallel-scanning=false
class.loader.buffer-size=33554432
class.loader.default-scan-locations=io.github.ygrip.testara
class.loader.scan-locations.request-data=io.github.ygrip.testara
class.loader.scan-locations.response-data=io.github.ygrip.testara
#Validator Helper configuration
validator.helper.scan-locations=io.github.ygrip.testara.validation
validator.helper.scan-timeout=5
#--------------------------------------------
#Browser setting
#--------------------------------------------
vibium.browser.owner=Automation Framework
vibium.browser.headless=true
#--------------------------------------------
#Remote connect setting (StartOptions.connectURL/connectHeaders — not an outbound proxy)
#--------------------------------------------
vibium.browser.remote-connect.enabled=false
vibium.browser.remote-connect.url=
