name: Reporter Final Verify

on:
  push:
    branches:
      - agent/testcontainers-grid-client
    paths:
      - .github/workflows/reporter-final-verify.yml

permissions:
  contents: read

jobs:
  reporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install reporter prerequisites
        run: mvn -pl testara-reporter -am install -DskipTests -B --no-transfer-progress
      - name: Run reporter tests
        run: mvn -pl testara-reporter test -DskipTests=false -B --no-transfer-progress
