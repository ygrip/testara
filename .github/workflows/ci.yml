name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (generates agent catalog)
        run: mvn install -DskipTests -B --no-transfer-progress

      - name: Verify catalog was generated
        run: |
          CATALOG=testara-agent/target/classes/agent-context/flavor-catalog.json
          if [ ! -f "$CATALOG" ]; then
            echo "ERROR: flavor-catalog.json not found — catalog generation failed"
            exit 1
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('$CATALOG'))))")
          echo "Catalog entries: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "ERROR: catalog suspiciously small ($COUNT entries)"
            exit 1
          fi

      - name: Enable the Chrome sandbox on Ubuntu
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        run: mvn verify -B --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
