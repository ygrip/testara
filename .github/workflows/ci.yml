name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: One-time bump Testara to 2.2.0
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/testcontainers-grid-client'
        run: |
          mvn org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion=2.2.0 \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false \
            -B --no-transfer-progress

          if git diff --quiet -- pom.xml '**/pom.xml'; then
            echo "Testara reactor is already at 2.2.0"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pom.xml '**/pom.xml'
            git commit -m 'chore: bump Testara to 2.2.0'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Build (generates agent catalog)
        run: mvn install -DskipTests -B --no-transfer-progress

      - name: Verify catalog was generated
        run: |
          CATALOG=testara-agent/target/classes/agent-context/flavor-catalog.json
          if [ ! -f "$CATALOG" ]; then
            echo "ERROR: flavor-catalog.json not found — catalog generation failed"
            exit 1
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('$CATALOG'))))")
          echo "Catalog entries: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "ERROR: catalog suspiciously small ($COUNT entries)"
            exit 1
          fi

      - name: Enable the Chrome sandbox on Ubuntu
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Test
        run: mvn verify -B --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
