name: Reporter CSS at-rule verification

on:
  push:
    branches:
      - agent/testcontainers-grid-client

jobs:
  reporter-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify reporter template CSS at-rules
        run: |
          if grep -RInE --include='*.jte' '@@(media|supports|keyframes|font-face|container|layer)\b' testara-reporter/src/main/jte; then
            echo 'Doubled CSS at-rule remains in reporter templates.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build reporter dependencies
        run: mvn -pl testara-reporter -am install -DskipTests -B --no-transfer-progress

      - name: Verify rendered CSS at-rules
        run: mvn -pl testara-reporter -Dtest=JteReportRendererTest -Dsurefire.failIfNoSpecifiedTests=false test -B --no-transfer-progress
