name: Reporter CSS at-rule verification

on:
  push:
    branches:
      - agent/testcontainers-grid-client

jobs:
  reporter-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Normalize CSS at-rules in reporter templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'@@(?=(?:media|supports|keyframes|font-face|container|layer)\b)')
          changed = []
          replacements = 0

          for path in Path('testara-reporter/src/main/jte').rglob('*.jte'):
              source = path.read_text()
              updated, count = pattern.subn('@', source)
              if count:
                  path.write_text(updated)
                  changed.append(str(path))
                  replacements += count

          print(f'Normalized {replacements} doubled CSS at-rule(s) across {len(changed)} template(s).')
          for path in changed:
              print(path)
          PY
          if grep -RInE --include='*.jte' '@@(media|supports|keyframes|font-face|container|layer)\b' testara-reporter/src/main/jte; then
            echo 'Doubled CSS at-rule remains in reporter templates.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build reporter dependencies
        run: mvn -pl testara-reporter -am install -DskipTests -B --no-transfer-progress

      - name: Verify rendered CSS at-rules
        run: mvn -pl testara-reporter -Dtest=JteReportRendererTest -Dsurefire.failIfNoSpecifiedTests=false test -B --no-transfer-progress

      - name: Commit normalized templates
        run: |
          if git diff --quiet -- testara-reporter/src/main/jte; then
            echo 'No template changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testara-reporter/src/main/jte
          git commit -m 'fix(reporter): emit valid CSS at-rules'
          git push
