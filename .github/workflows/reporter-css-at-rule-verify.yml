name: Reporter CSS at-rule verification

on:
  push:
    branches:
      - agent/testcontainers-grid-client

jobs:
  reporter-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build reporter dependencies
        run: mvn -pl testara-reporter -am install -DskipTests -B --no-transfer-progress
      - name: Verify rendered CSS at-rules
        run: mvn -pl testara-reporter -Dtest=JteReportRendererTest -Dsurefire.failIfNoSpecifiedTests=false test -B --no-transfer-progress
