name: Rich Cucumber reporter fix

on:
  push:
    branches:
      - agent/testcontainers-grid-client

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply reporter data-contract fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          step_path = "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cucumber/Step.java"
          replace(step_path,
              "import com.fasterxml.jackson.annotation.JsonIgnore;\n",
              "import com.fasterxml.jackson.annotation.JsonAlias;\nimport com.fasterxml.jackson.annotation.JsonIgnore;\n")
          replace(step_path,
              '@JsonProperty("outputs")\n  @JsonInclude(JsonInclude.Include.NON_EMPTY)\n  private final List<Output> outputs',
              '@JsonProperty("output")\n  @JsonAlias("outputs")\n  @JsonInclude(JsonInclude.Include.NON_EMPTY)\n  private final List<Output> outputs')
          replace(step_path,
              "  public Match getMatch() {\n    return this.match;\n  }\n",
              "  @JsonInclude(JsonInclude.Include.NON_EMPTY)\n  public List<Argument> getArguments() {\n    return this.arguments;\n  }\n\n  public Match getMatch() {\n    return this.match;\n  }\n")
          replace(step_path,
              "this.afterStatus =\n        (new StatusCounter(this.before.toArray(new Resultsable[0]))).getFinalStatus();",
              "this.afterStatus =\n        (new StatusCounter(this.after.toArray(new Resultsable[0]))).getFinalStatus();")

          hook_path = "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cucumber/Hook.java"
          replace(hook_path,
              "import com.fasterxml.jackson.annotation.JsonIgnore;\n",
              "import com.fasterxml.jackson.annotation.JsonAlias;\nimport com.fasterxml.jackson.annotation.JsonIgnore;\n")
          replace(hook_path,
              '@JsonProperty("outputs")\n  @JsonInclude(JsonInclude.Include.NON_EMPTY)\n  private final List<Output> outputs',
              '@JsonProperty("output")\n  @JsonAlias("outputs")\n  @JsonInclude(JsonInclude.Include.NON_EMPTY)\n  private final List<Output> outputs')
          replace(hook_path,
              "    if (!this.embeddings.isEmpty()) {\n      return true;\n    } else {",
              "    if (!this.embeddings.isEmpty() || !this.outputs.isEmpty()) {\n      return true;\n    } else {")

          element_path = "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cucumber/Element.java"
          replace(element_path,
              "    this.stepsStatus = (new StatusCounter(this.steps.toArray(new Resultsable[0]))).getFinalStatus();\n    this.beforeStatus = (new StatusCounter(this.after.toArray(new Resultsable[0]))).getFinalStatus();\n    this.afterStatus = (new StatusCounter(this.before.toArray(new Resultsable[0]))).getFinalStatus();",
              "    StatusCounter stepCounter = new StatusCounter();\n    for (Step step : this.steps) {\n      step.setMetaData();\n      stepCounter.incrementFor(step.getResult().getStatus());\n      stepCounter.incrementFor(step.getBeforeStatus());\n      stepCounter.incrementFor(step.getAfterStatus());\n    }\n    this.stepsStatus = stepCounter.getFinalStatus();\n    this.beforeStatus = (new StatusCounter(this.before.toArray(new Resultsable[0]))).getFinalStatus();\n    this.afterStatus = (new StatusCounter(this.after.toArray(new Resultsable[0]))).getFinalStatus();")
          replace(element_path,
              "    for (Step step : this.steps) {\n      this.duration += step.getResult().getDuration();\n    }",
              "    for (Step step : this.steps) {\n      for (Hook hook : step.getBefore()) {\n        this.duration += hook.getResult().getDuration();\n      }\n      this.duration += step.getResult().getDuration();\n      for (Hook hook : step.getAfter()) {\n        this.duration += hook.getResult().getDuration();\n      }\n    }")

          Path("testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cucumber/DocString.java").write_text('''package io.github.ygrip.testara.reporter.cucumber;\n\nimport java.io.Serializable;\n\nimport com.fasterxml.jackson.annotation.JsonInclude;\nimport com.fasterxml.jackson.annotation.JsonProperty;\n\npublic class DocString implements Serializable {\n  @JsonProperty("value")\n  private final String value = null;\n  @JsonProperty("line")\n  @JsonInclude(JsonInclude.Include.NON_NULL)\n  private final Integer line = null;\n  @JsonProperty("content_type")\n  @JsonInclude(JsonInclude.Include.NON_NULL)\n  private final String contentType = null;\n\n  public DocString() {\n  }\n\n  public String getValue() {\n    return this.value;\n  }\n\n  public Integer getLine() {\n    return this.line;\n  }\n\n  public String getContentType() {\n    return this.contentType;\n  }\n}\n''')

          Path("testara-reporter/src/main/java/io/github/ygrip/testara/reporter/view/ReportView.java").write_text('''package io.github.ygrip.testara.reporter.view;\n\nimport java.util.List;\n\npublic record ReportView(\n    ReportMetadata metadata,\n    ReportBranding branding,\n    ReportStatusSummary status,\n    List<ReportField> customFields,\n    List<ReportCoverageGroup> coverage,\n    List<ReportFailure> frequentFailures,\n    List<ReportUnstableFeature> unstableFeatures,\n    List<ReportDurationItem> longestScenarios,\n    List<ReportDurationItem> longestSteps,\n    List<ReportScenario> scenarios\n) {\n  public record ReportMetadata(String title, String startTime, String endTime, String generatedAt, String reportLink, int totalFeatures, int totalScenarios, int totalSteps, String totalExecutionTime, String averageExecutionTime, String fastestTest, String slowestTest) {}\n  public record ReportBranding(String organizationName, String logoUri, String organizationDetail, boolean whiteLabeled) {}\n  public record ReportStatusSummary(String overallStatus, String overallColor, String overallBackground, int passRate, List<ReportStatusMetric> metrics) {}\n  public record ReportStatusMetric(String label, int count, int percentage, String color, String background, String icon) {}\n  public record ReportField(String label, String value) {}\n  public record ReportCoverageGroup(String title, String duration, List<ReportCoverageItem> items) {}\n  public record ReportCoverageItem(String name, int testCount, String successRate, int passPercentage, String duration) {}\n  public record ReportFailure(String name, String error, int count, int relativePercentage, String severity) {}\n  public record ReportUnstableFeature(String name, int failurePercentage) {}\n  public record ReportDurationItem(String label, String duration, int percentage, Integer count) {}\n\n  public record ReportScenario(\n      String id, String name, String feature, String suite, String tags, String status, String duration, long durationNanos,\n      boolean exampleExecution, String exampleLabel, String error, String keyword, String description, Integer line,\n      String startedAt, List<ReportHook> beforeHooks, List<ReportHook> afterHooks, List<ReportScenarioStep> steps\n  ) {}\n\n  public record ReportScenarioStep(\n      String keyword, String name, String status, String duration, String error, Integer line, String matchLocation,\n      List<ReportArgument> arguments, List<String> outputs, List<String> comments, List<List<String>> dataTable,\n      ReportDocString docString, List<ReportAttachment> attachments, List<ReportHook> beforeHooks, List<ReportHook> afterHooks\n  ) {}\n\n  public record ReportHook(\n      String status, String duration, String location, String error, List<ReportArgument> arguments,\n      List<String> outputs, List<ReportAttachment> attachments\n  ) {}\n\n  public record ReportArgument(String value, Integer offset) {}\n  public record ReportDocString(String value, Integer line, String contentType) {}\n  public record ReportAttachment(String name, String mimeType, String uri, String kind) {}\n}\n''')

          factory = "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/view/CucumberReportViewFactory.java"
          replace(factory,
              "import io.github.ygrip.testara.reporter.cucumber.Element;\nimport io.github.ygrip.testara.reporter.cucumber.Embedding;\nimport io.github.ygrip.testara.reporter.cucumber.Feature;",
              "import io.github.ygrip.testara.reporter.cucumber.Argument;\nimport io.github.ygrip.testara.reporter.cucumber.Element;\nimport io.github.ygrip.testara.reporter.cucumber.Embedding;\nimport io.github.ygrip.testara.reporter.cucumber.Feature;\nimport io.github.ygrip.testara.reporter.cucumber.Hook;\nimport io.github.ygrip.testara.reporter.cucumber.Match;\nimport io.github.ygrip.testara.reporter.cucumber.Output;")
          replace(factory,
              "import io.github.ygrip.testara.reporter.view.ReportView.ReportAttachment;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportBranding;",
              "import io.github.ygrip.testara.reporter.view.ReportView.ReportArgument;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportAttachment;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportBranding;")
          replace(factory,
              "import io.github.ygrip.testara.reporter.view.ReportView.ReportMetadata;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportScenario;",
              "import io.github.ygrip.testara.reporter.view.ReportView.ReportDocString;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportHook;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportMetadata;\nimport io.github.ygrip.testara.reporter.view.ReportView.ReportScenario;")

          old = '''  private List<ReportScenario> scenarioViews(List<Feature> features) {\n    List<ReportScenario> result = new ArrayList<>();\n    int scenarioIndex = 0;\n    for (Feature feature : features) {\n      String suite = suiteTitle(feature);\n      for (Element element : feature.getElements()) {\n        if (!element.isScenario()) {\n          continue;\n        }\n        scenarioIndex++;\n        List<ReportScenarioStep> steps = element.getSteps().stream().map(this::scenarioStep).toList();\n        String error = steps.stream().map(ReportScenarioStep::error).filter(value -> !isBlank(value)).findFirst().orElse(null);\n        boolean exampleExecution = element.isScenarioOutline();\n        result.add(new ReportScenario(\n          "scenario-" + scenarioIndex,\n          element.getName(),\n          feature.getName(),\n          suite,\n          tags(feature, element),\n          element.getStatus().name(),\n          CommonUtil.formatDuration(element.getDuration()),\n          element.getDuration(),\n          exampleExecution,\n          exampleExecution ? exampleLabel(element) : null,\n          error,\n          steps\n        ));\n      }\n    }\n    return List.copyOf(result);\n  }\n\n  private ReportScenarioStep scenarioStep(Step step) {\n    String error = step.getResult().getErrorMessage();\n    String docString = step.getDocString() == null || isBlank(step.getDocString().getValue())\n      ? null\n      : step.getDocString().getValue();\n    return new ReportScenarioStep(\n      stepKeyword(step),\n      step.getName(),\n      step.getResult().getStatus().name(),\n      CommonUtil.formatDuration(step.getDuration()),\n      isBlank(error) ? null : error,\n      dataTable(step),\n      docString,\n      step.getEmbeddings().stream().map(this::attachment).toList()\n    );\n  }\n\n'''
          new = '''  private List<ReportScenario> scenarioViews(List<Feature> features) {\n    List<ReportScenario> result = new ArrayList<>();\n    int scenarioIndex = 0;\n    for (Feature feature : features) {\n      String suite = suiteTitle(feature);\n      for (Element element : feature.getElements()) {\n        if (!element.isScenario()) {\n          continue;\n        }\n        scenarioIndex++;\n        List<ReportScenarioStep> steps = element.getSteps().stream().map(this::scenarioStep).toList();\n        List<ReportHook> beforeHooks = element.getBefore().stream().map(this::hook).toList();\n        List<ReportHook> afterHooks = element.getAfter().stream().map(this::hook).toList();\n        String error = firstError(beforeHooks, steps, afterHooks);\n        boolean exampleExecution = element.isScenarioOutline();\n        result.add(new ReportScenario(\n          "scenario-" + scenarioIndex, element.getName(), feature.getName(), suite, tags(feature, element),\n          element.getStatus().name(), CommonUtil.formatDuration(element.getDuration()), element.getDuration(),\n          exampleExecution, exampleExecution ? exampleLabel(element) : null, error, element.getKeyword(),\n          element.getDescription(), element.getLine(), element.getStartTime() == null ? null : element.getStartTime().toString(),\n          beforeHooks, afterHooks, steps\n        ));\n      }\n    }\n    return List.copyOf(result);\n  }\n\n  private ReportScenarioStep scenarioStep(Step step) {\n    String error = step.getResult().getErrorMessage();\n    ReportDocString docString = step.getDocString() == null || isBlank(step.getDocString().getValue())\n      ? null\n      : new ReportDocString(step.getDocString().getValue(), step.getDocString().getLine(), step.getDocString().getContentType());\n    Match match = step.getMatch();\n    List<Argument> sourceArguments = match != null && !match.getArguments().isEmpty() ? match.getArguments() : step.getArguments();\n    return new ReportScenarioStep(\n      stepKeyword(step), step.getName(), step.getResult().getStatus().name(), CommonUtil.formatDuration(step.getDuration()),\n      isBlank(error) ? null : error, step.getLine(), match == null ? null : match.getLocation(), arguments(sourceArguments),\n      outputs(step.getOutputs()), List.copyOf(step.getComments()), dataTable(step), docString, attachments(step.getEmbeddings()),\n      step.getBefore().stream().map(this::hook).toList(), step.getAfter().stream().map(this::hook).toList()\n    );\n  }\n\n  private ReportHook hook(Hook hook) {\n    Match match = hook.getMatch();\n    String error = hook.getResult().getErrorMessage();\n    return new ReportHook(\n      hook.getResult().getStatus().name(), CommonUtil.formatDuration(hook.getResult().getDuration()),\n      match == null ? null : match.getLocation(), isBlank(error) ? null : error,\n      arguments(match == null ? List.of() : match.getArguments()), outputs(hook.getOutputs()), attachments(hook.getEmbeddings())\n    );\n  }\n\n  private List<ReportArgument> arguments(List<Argument> values) {\n    if (values == null || values.isEmpty()) {\n      return List.of();\n    }\n    return values.stream().map(value -> new ReportArgument(value.getVal(), value.getOffset())).toList();\n  }\n\n  private List<String> outputs(List<Output> values) {\n    if (values == null || values.isEmpty()) {\n      return List.of();\n    }\n    return values.stream().filter(value -> value != null && value.getMessages() != null)\n      .flatMap(value -> value.getMessages().stream()).filter(value -> !isBlank(value)).toList();\n  }\n\n  private List<ReportAttachment> attachments(List<Embedding> values) {\n    if (values == null || values.isEmpty()) {\n      return List.of();\n    }\n    return values.stream().map(this::attachment).toList();\n  }\n\n  private String firstError(List<ReportHook> beforeHooks, List<ReportScenarioStep> steps, List<ReportHook> afterHooks) {\n    String error = beforeHooks.stream().map(ReportHook::error).filter(value -> !isBlank(value)).findFirst().orElse(null);\n    if (!isBlank(error)) {\n      return error;\n    }\n    for (ReportScenarioStep step : steps) {\n      if (!isBlank(step.error())) {\n        return step.error();\n      }\n      error = step.beforeHooks().stream().map(ReportHook::error).filter(value -> !isBlank(value)).findFirst().orElse(null);\n      if (!isBlank(error)) {\n        return error;\n      }\n      error = step.afterHooks().stream().map(ReportHook::error).filter(value -> !isBlank(value)).findFirst().orElse(null);\n      if (!isBlank(error)) {\n        return error;\n      }\n    }\n    return afterHooks.stream().map(ReportHook::error).filter(value -> !isBlank(value)).findFirst().orElse(null);\n  }\n\n'''
          replace(factory, old, new)

          # Reusable rich-detail fragments.
          Path("testara-reporter/src/main/jte/browser/error.jte").write_text('''@param String label\n@param String message\n@if(message != null && !message.isBlank())\n<details class="error-disclosure" data-error-container open>\n  <summary class="error-summary"><span>${label}</span><span class="error-toggle-label" aria-hidden="true"></span></summary>\n  <pre class="error-box error-scroll" data-error-content>${message}</pre>\n</details>\n@endif\n''')

          Path("testara-reporter/src/main/jte/browser/attachments.jte").write_text('''@import java.util.List\n@import io.github.ygrip.testara.reporter.view.ReportView.ReportAttachment\n@param List<ReportAttachment> attachments\n@if(attachments != null && !attachments.isEmpty())\n<div class="attachment-grid">\n  @for(var attachment : attachments)\n    @if(attachment.kind().equals("image"))\n      <figure class="attachment-card"><img class="attachment-image" src="${attachment.uri()}" alt="${attachment.name()}" loading="lazy"><figcaption>${attachment.name()}</figcaption></figure>\n    @elseif(attachment.kind().equals("video"))\n      <figure class="attachment-card"><video class="attachment-video" controls preload="metadata"><source src="${attachment.uri()}" type="${attachment.mimeType()}"></video><figcaption>${attachment.name()}</figcaption></figure>\n    @elseif(attachment.kind().equals("audio"))\n      <div class="attachment-card attachment-audio"><audio controls preload="metadata"><source src="${attachment.uri()}" type="${attachment.mimeType()}"></audio><span>${attachment.name()}</span></div>\n    @else\n      <a class="attachment-file" href="${attachment.uri()}" download="${attachment.name()}">${attachment.name()} · ${attachment.mimeType()}</a>\n    @endif\n  @endfor\n</div>\n@endif\n''')

          Path("testara-reporter/src/main/jte/browser/hooks.jte").write_text('''@import java.util.List\n@import io.github.ygrip.testara.reporter.view.ReportView.ReportHook\n@param String label\n@param List<ReportHook> hooks\n@if(hooks != null && !hooks.isEmpty())\n<div class="hook-section">\n  @for(var hook : hooks)\n    <section class="hook-card">\n      <div class="hook-head">\n        <div class="hook-title"><span class="status-pill status-${hook.status().toLowerCase()}">${hook.status()}</span><strong>${label}</strong></div>\n        <small>${hook.duration()}</small>\n      </div>\n      @if(hook.location() != null && !hook.location().isBlank())<div class="hook-location">${hook.location()}</div>@endif\n      @if(hook.arguments() != null && !hook.arguments().isEmpty())\n        <div class="hook-arguments">@for(var argument : hook.arguments())<span>${argument.value()}@if(argument.offset() != null) · offset ${argument.offset()}@endif</span>@endfor</div>\n      @endif\n      @if(hook.outputs() != null && !hook.outputs().isEmpty())\n        <div class="step-artifact"><div class="artifact-label">Output</div><div class="output-list">@for(var output : hook.outputs())<div>${output}</div>@endfor</div></div>\n      @endif\n      @if(hook.attachments() != null && !hook.attachments().isEmpty())\n        <div class="step-artifact"><div class="artifact-label">Attachments</div>@template.browser.attachments(hook.attachments())</div>\n      @endif\n      @template.browser.error("Hook error", hook.error())\n    </section>\n  @endfor\n</div>\n@endif\n''')

          results = "testara-reporter/src/main/jte/browser/results.jte"
          replace(results,
              "              @if(scenario.error() != null && !scenario.error().isBlank())\n                <pre class=\"error-box scenario-error\">${scenario.error()}</pre>\n              @endif\n\n              <div class=\"detail-section-head\"><div><div class=\"card-eyebrow\">Steps</div>",
              "              @template.browser.hooks(\"Before scenario\", scenario.beforeHooks())\n              @template.browser.error(\"Scenario error\", scenario.error())\n\n              <div class=\"detail-section-head\"><div><div class=\"card-eyebrow\">Steps</div>")
          replace(results,
              "                      <div class=\"step-title-row\"><span class=\"step-number\" aria-hidden=\"true\"></span><strong>${step.keyword()} ${step.name()}</strong><small class=\"step-duration\">${step.duration()}</small></div>\n                      @if(step.error() != null && !step.error().isBlank())<pre class=\"error-box step-error\">${step.error()}</pre>@endif\n",
              "                      <div class=\"step-title-row\"><span class=\"step-number\" aria-hidden=\"true\"></span><strong>${step.keyword()} ${step.name()}</strong><small class=\"step-duration\">${step.duration()}</small></div>\n                      @if(step.line() != null || (step.matchLocation() != null && !step.matchLocation().isBlank()) || (step.arguments() != null && !step.arguments().isEmpty()))\n                        <div class=\"step-source-meta\">@if(step.line() != null)<span>Line ${step.line()}</span>@endif @if(step.matchLocation() != null && !step.matchLocation().isBlank())<span>${step.matchLocation()}</span>@endif @for(var argument : step.arguments())<span>${argument.value()}@if(argument.offset() != null) · offset ${argument.offset()}@endif</span>@endfor</div>\n                      @endif\n                      @template.browser.hooks(\"Before step\", step.beforeHooks())\n                      @template.browser.error(\"Step error\", step.error())\n                      @if(step.outputs() != null && !step.outputs().isEmpty())<div class=\"step-artifact\"><div class=\"artifact-label\">Output</div><div class=\"output-list\">@for(var output : step.outputs())<div>${output}</div>@endfor</div></div>@endif\n                      @if(step.comments() != null && !step.comments().isEmpty())<div class=\"step-artifact\"><div class=\"artifact-label\">Comments</div><div class=\"output-list\">@for(var comment : step.comments())<div>${comment}</div>@endfor</div></div>@endif\n")
          replace(results,
              "                      @if(step.docString() != null && !step.docString().isBlank())\n                        <div class=\"step-artifact\"><div class=\"artifact-label\">Multiline text</div><pre class=\"step-doc-string\">${step.docString()}</pre></div>\n                      @endif\n",
              "                      @if(step.docString() != null)\n                        <div class=\"step-artifact\"><div class=\"artifact-label\">Multiline text@if(step.docString().contentType() != null && !step.docString().contentType().isBlank()) · ${step.docString().contentType()}@endif@if(step.docString().line() != null) · line ${step.docString().line()}@endif</div><pre class=\"step-doc-string\">${step.docString().value()}</pre></div>\n                      @endif\n")
          old_attach = '''                      @if(step.attachments() != null && !step.attachments().isEmpty())\n                        <div class="step-artifact"><div class="artifact-label">Attachments</div><div class="attachment-grid">\n                          @for(var attachment : step.attachments())\n                            @if(attachment.kind().equals("image"))\n                              <figure class="attachment-card"><img class="attachment-image" src="${attachment.uri()}" alt="${attachment.name()}" loading="lazy"><figcaption>${attachment.name()}</figcaption></figure>\n                            @elseif(attachment.kind().equals("video"))\n                              <figure class="attachment-card"><video class="attachment-video" controls preload="metadata"><source src="${attachment.uri()}" type="${attachment.mimeType()}"></video><figcaption>${attachment.name()}</figcaption></figure>\n                            @elseif(attachment.kind().equals("audio"))\n                              <div class="attachment-card attachment-audio"><audio controls preload="metadata"><source src="${attachment.uri()}" type="${attachment.mimeType()}"></audio><span>${attachment.name()}</span></div>\n                            @else\n                              <a class="attachment-file" href="${attachment.uri()}" download="${attachment.name()}">${attachment.name()} · ${attachment.mimeType()}</a>\n                            @endif\n                          @endfor\n                        </div></div>\n                      @endif\n'''
          new_attach = '''                      @if(step.attachments() != null && !step.attachments().isEmpty())\n                        <div class="step-artifact"><div class="artifact-label">Attachments</div>@template.browser.attachments(step.attachments())</div>\n                      @endif\n                      @template.browser.hooks("After step", step.afterHooks())\n'''
          replace(results, old_attach, new_attach)
          replace(results,
              "              </div>\n            </article>\n          @endfor\n",
              "              </div>\n              @template.browser.hooks(\"After scenario\", scenario.afterHooks())\n            </article>\n          @endfor\n")

          explorer = "testara-reporter/src/main/jte/browser/explorer.jte"
          marker = "  .step-number::before{content:counter(scenario-step)}\n\n@media(max-width:760px){"
          styles = '''  .step-number::before{content:counter(scenario-step)}\n\n  .step-source-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin:5px 0 0 44px;color:var(--muted);font-size:10px;overflow-wrap:anywhere}\n  .hook-section{display:grid;gap:8px;margin-top:11px}.hook-card{min-width:0;padding:10px 11px;border:1px solid #DCE6EB;border-radius:10px;background:#FAFCFD;text-align:left}.hook-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.hook-title{display:flex;align-items:center;gap:8px;min-width:0}.hook-head small{color:var(--muted);white-space:nowrap}.hook-location{margin-top:6px;color:#526171;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}.hook-arguments{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.hook-arguments span{padding:3px 6px;border-radius:6px;background:#EEF4F6;color:#526171;font-size:10px}.output-list{max-height:180px;overflow:auto;padding:9px 10px;border:1px solid #DDE6EB;border-radius:8px;background:#FFF;color:#334155;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.error-disclosure{margin-top:10px;border:1px solid #FECACA;border-radius:9px;background:#FFF8F8;overflow:hidden}.error-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px;color:#991B1B;font-size:11px;font-weight:800;cursor:pointer;list-style:none}.error-summary::-webkit-details-marker{display:none}.error-toggle-label::before{content:"Expand"}.error-disclosure[open] .error-toggle-label::before{content:"Collapse"}.error-scroll{max-height:280px;overflow:auto!important;overscroll-behavior:contain;scrollbar-gutter:stable;border:0!important;border-top:1px solid #FECACA!important;border-radius:0!important;margin:0!important}.scenario-error{margin-bottom:18px}\n\n@media(max-width:760px){'''
          replace(explorer, marker, styles)

          screenshot = "testara-ui-cucumber/src/main/java/io/github/ygrip/testara/ui/service/ScreenshotService.java"
