name: Finalize reporter migration wiring

on:
  push:
    branches:
      - agent/testcontainers-grid-client
    paths:
      - .github/workflows/reporter-migration-bootstrap.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/testcontainers-grid-client
          fetch-depth: 0

      - name: Wire all reporter consumers and remove Thymeleaf management
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "pom.xml",
              "    <!-- Reporting versions -->\n    <thymeleaf.version>3.1.5.RELEASE</thymeleaf.version>\n    <thymeleaf.extras.java8time.version>3.0.4.RELEASE</thymeleaf.extras.java8time.version>",
              "    <!-- Reporting versions -->\n    <jte.version>3.2.4</jte.version>"
          )
          replace(
              "pom.xml",
              "      <dependency>\n        <groupId>org.thymeleaf</groupId>\n        <artifactId>thymeleaf</artifactId>\n        <version>${thymeleaf.version}</version>\n      </dependency>\n      <dependency>\n        <groupId>org.thymeleaf.extras</groupId>\n        <artifactId>thymeleaf-extras-java8time</artifactId>\n        <version>${thymeleaf.extras.java8time.version}</version>\n      </dependency>\n",
              ""
          )
          replace(
              "testara-reporter/pom.xml",
              "        <jte.version>3.2.4</jte.version>\n",
              ""
          )
          replace(
              "testara-junit5/src/main/java/io/github/ygrip/testara/engine/context/TestaraCucumberEngineExecutionContext.java",
              "                .withReportTemplate(\"testara-simple-report\")\n",
              ""
          )
          replace(
              "testara-reporter-plugin/src/main/java/io/github/ygrip/testara/reporter/plugin/GenerateCucumberSummaryReportMojo.java",
              "  @Parameter(property = \"report-template\", defaultValue = \"testara-style-report\")",
              "  @Parameter(property = \"report-template\", defaultValue = \"modern\")"
          )
          replace(
              "testara-reporter-plugin/src/main/java/io/github/ygrip/testara/reporter/plugin/GenerateCucumberSummaryReportMojo.java",
              "      output = \"testara-style-report\";",
              "      output = \"modern\";"
          )
          replace(
              "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cli/TestaraReporter.java",
              ".setSampleValue(\"testara-style-report | testara-single-page-report | testara-simple-report\")",
              ".setSampleValue(\"modern | classic | simple | single-page\")"
          )
          replace(
              "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cli/TestaraReporter.java",
              ".setDescription(\"single page report template, default : testara-style-report\")",
              ".setDescription(\"report style, default : modern\")"
          )
          replace(
              "testara-reporter/src/main/java/io/github/ygrip/testara/reporter/cli/TestaraReporter.java",
              "inputType.getSubOption(\"single-page-template\", \"testara-style-report\")",
              "inputType.getSubOption(\"single-page-template\", \"modern\")"
          )
          PY

          git rm .github/workflows/reporter-migration-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml testara-reporter/pom.xml testara-junit5 testara-reporter-plugin testara-reporter
          git commit -m "wire JUnit and reporter entry points to configured JTE style"
          git push origin HEAD:agent/testcontainers-grid-client
