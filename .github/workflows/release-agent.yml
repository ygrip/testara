name: Release Testara Agent

on:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write

jobs:
  release-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build agent fat JAR
        run: mvn -pl testara-agent-cli -am package -DskipTests -B --no-transfer-progress

      - name: Prepare release assets
        run: |
          cp testara-agent-cli/target/testara-agent.jar testara-agent.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Testara Agent ${{ github.ref_name }}"
          files: |
            testara-agent.jar
