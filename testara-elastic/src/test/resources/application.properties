#Consul properties
config.consul.enabled=${CONSUL_ENABLED:true}
config.consul.host=${CONSUL_HOST:localhost}
config.consul.port=${CONSUL_PORT:8500}
config.consul.acl-token=${CONSUL_TOKEN:local-root-token}
config.consul.prefix=${CONFIG_PATH:config/testara-automation}/${TEST_ENV:qa}/
#Vault properties
config.vault.enabled=${VAULT_ENABLED:true}
config.vault.address=${VAULT_HOST:http://127.0.0.1:8200}
config.vault.token=${VAULT_TOKEN:myroot}
config.vault.engine-version=${VAULT_ENGINE_VERSION:2}
config.vault.path=${VAULT_PATH:config/testara-automation}/${TEST_ENV:qa}
#Elasticsearch Properties
elasticsearch.service.agp.hosts=rnd-elastic-v6-1.preprod-sg.cld:9200,rnd-elastic-v6-2.preprod-sg.cld:9200,rnd-elastic-v6-3.preprod-sg.cld:9200
elasticsearch.service.agp.username=
elasticsearch.service.agp.password=
elasticsearch.service.agp.secured=false
elasticsearch.service.agp.require-authentication=false
elasticsearch.timeout=30